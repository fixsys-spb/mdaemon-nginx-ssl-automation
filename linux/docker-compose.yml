# Nginx Proxy Manager - Docker Compose
# Project: MDaemon SSL Automation
# Docs: https://nginxproxymanager.com/guide/#quick-setup

services:
  app:
    image: 'docker.io/jc21/nginx-proxy-manager:latest'
    restart: unless-stopped
    ports:
      - '80:80'    # HTTP - for Let's Encrypt challenge and redirects
      - '81:81'    # Admin UI - NPM management
      - '443:443'  # HTTPS - proxy traffic
    volumes:
      # NPM Data (database, users, settings)
      - ./data:/data
      # Let's Encrypt certificates.
      # Shared to host so Samba can distribute them.
      - ./letsencrypt:/etc/letsencrypt